name: Capture research associations
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.capture_associations --output capture/research_associations
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-associations-snapshot
          path: backend/capture/
          retention-days: 30
