name: Capture public scientific snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m scripts.capture_snapshot --output capture/luad_snv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scientific-snapshot
          path: backend/capture/
          retention-days: 30
