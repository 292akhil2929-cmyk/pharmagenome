services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pharmagenome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pharmagenome
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmagenome"]
      interval: 5s
      retries: 10
  migrate:
    build: ./backend
    command: ["sh", "-c", "python -m scripts.migrate && python -m scripts.load_snapshot && python -m scripts.load_associations"]
    environment:
      DATABASE_URL: postgresql://pharmagenome:${POSTGRES_PASSWORD}@db:5432/pharmagenome
    depends_on:
      db: {condition: service_healthy}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://pharmagenome:${POSTGRES_PASSWORD}@db:5432/pharmagenome
      ALLOWED_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    build: ./frontend
    environment:
      API_BASE_URL: http://backend:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
